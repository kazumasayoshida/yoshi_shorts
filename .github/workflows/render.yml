name: ショート動画を書き出す

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "書き出す動画ID（空欄なら全部。例: 01_flamingo）"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - name: 必要なソフトを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg librsvg2-bin fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q -r requirements.txt

      - name: VOICEVOXの起動を待つ
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:50021/version && exit 0
            sleep 5
          done
          echo "VOICEVOXが起動しませんでした"; exit 1

      - name: 動画を書き出す
        run: python make_short.py scripts.json out ${{ github.event.inputs.ids }}

      - name: 動画を保存（Actionsの画面からダウンロード可）
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/*.mp4
          retention-days: 14
